[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nut-up"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    # Upper bounds cap supply-chain blast radius: a future major-version
    # release can't land on `make update` without a deliberate bump here.
    # For exact transitive-dep pinning, run `make lock` on the install host
    # to produce requirements.lock — committed and preferred over PyPI
    # resolution if present.
    # Lower bounds exclude known CVEs; `make update` only upgrades a package
    # already in the venv when it falls below its floor.
    "starlette>=1.0.1,<2",  # 1.0.1: CVE-2026-48710 (Host header); 0.49.1: CVE-2025-62727
    "uvicorn>=0.31,<0.55",  # 0.31: CIDR ranges in forwarded_allow_ips; no [standard] extras
    "h11>=0.16,<1",  # uvicorn's HTTP parser; 0.16: CVE-2025-43859 (request smuggling)
    "jinja2>=3.1.6,<4",
    "click>=8.1,<9",
    "pyyaml>=6.0,<7",
]

[project.scripts]
nut-up = "nut_up.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
nut_up = ["templates/*.html", "templates/partials/*.html", "static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
